AWSTemplateFormatVersion: '2010-09-09'

Description: Laboratorio inicial de CloudFormation Git Sync

Parameters:
  CostCenterParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Centro de costos almacenado en Parameter Store
  EnvironmentName:
    Type: String
    Description: Nombre del ambiente de despliegue
    Default: Development
    AllowedValues:
      - Development
      - Laboratory
      - dev
      - lab

Resources:
  LabBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Project
          Value: GitSyncLab
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: CostCenter
          Value: !Ref CostCenterParameter

Outputs:
  BucketName:
    Description: Nombre del bucket creado
    Value: !Ref LabBucket
