AWSTemplateFormatVersion: '2010-09-09'

Description: Laboratorio inicial de CloudFormation Git Sync

Parameters:
  EnvironmentName:
    Type: String
    Description: Nombre del ambiente de despliegue
    Default: Development
    AllowedValues:
      - Development
      - Laboratory

Resources:
  LabBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Project
          Value: GitSyncLab
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  BucketName:
    Description: Nombre del bucket creado
    Value: !Ref LabBucket
